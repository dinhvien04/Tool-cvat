name: Week 2 CI

on:
  push:
    branches: [main, "week2-*", "fix/*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pyyaml pytest
          fi

      - name: Check serverless drift
        run: python scripts/sync_serverless_modules.py --check --target all

      - name: Run tests
        run: python -m pytest tests/ -x --tb=short -q -m "not live"

      - name: Validate YAML schemas
        if: contains(github.event_name, 'push') || contains(github.event_name, 'pull_request')
        run: |
          python -c "
          from core.week2_schema import load_pose17, load_vf50
          p = load_pose17()
          v = load_vf50()
          assert len(p.keypoints) == 17
          assert len(p.edges) == 18
          assert v.total_points == 50
          print('Schema validation passed')
          "
