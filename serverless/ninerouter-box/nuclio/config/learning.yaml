# ==============================================================================
# Tool-cvat: Correction Learning & Feedback Configuration
# ==============================================================================
# Controls local correction memory, few-shot retrieval, rule derivation,
# and storage lifecycle. All feedback data remains strictly local.
# ==============================================================================

feedback:
  # Enable or disable correction-aware adaptive inference globally
  enabled: true

  # Local SQLite database path (survives process and container restarts)
  db_path: ".tool-cvat/feedback.sqlite3"

  # Directory for saving small, privacy-preserving example crops (gitignored)
  examples_dir: ".tool-cvat/examples"

  # Whether to retrieve and inject multimodal/structured few-shot examples
  use_examples: true

  # Whether to retrieve and inject correction-derived rules into prompts
  use_rules: true

  # Maximum examples to inject per inference pass (strictly bounded to save tokens)
  max_examples_per_pass: 3

  # Minimum sample evidence required before synthesizing an automatic rule
  min_rule_samples: 3

  # Minimum IoU threshold to classify a cross-label change as RELABEL vs ADD+DELETE
  min_iou_relabel: 0.60

  # Minimum IoU threshold to consider an AI shape matching a human shape
  min_iou_match: 0.30

  # Storage limits to prevent unbounded local disk growth
  storage:
    max_examples_total: 150
    max_examples_per_label: 10
    max_crop_dimension: 512
    max_storage_mb: 50

  # Quality tiers weighting: Ground Truth > reviewed > completed > raw
  quality_tiers:
    ground_truth_weight: 1.0
    reviewed_weight: 0.8
    completed_weight: 0.6
    raw_weight: 0.4
