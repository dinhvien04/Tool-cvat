metadata:
  name: ninerouter-polygon-mask
  namespace: cvat
  annotations:
    name: 9Router Polygon + Mask
    type: detector
    spec: |
      [
        { "id": 1, "name": "area/alternative", "type": "any" },
        { "id": 2, "name": "area/drivable", "type": "any" },
        { "id": 3, "name": "road", "type": "any" },
        { "id": 4, "name": "sidewalk", "type": "any" },
        { "id": 5, "name": "building", "type": "any" },
        { "id": 6, "name": "wall", "type": "any" },
        { "id": 7, "name": "fence", "type": "any" },
        { "id": 8, "name": "vegetation", "type": "any" },
        { "id": 9, "name": "terrain", "type": "any" },
        { "id": 10, "name": "sky", "type": "any" }
      ]

spec:
  description: 9Router Polygon + Mask Detector (10 Semantic Surface & Infrastructure Regions via local 9Router)
  runtime: 'python:3.11'
  handler: main:handler
  eventTimeout: 60s

  env:
    - name: NINEROUTER_URL
      value: 'http://host.docker.internal:20128'
    - name: VISION_MODEL
      value: 'ag/gemini-3.8-flash-low'
    - name: POLYGON_MASK_MODEL
      value: 'ag/gemini-3.8-flash-low'
    - name: DETECTION_MODE
      value: 'polygon_mask'
    - name: NINEROUTER_TIMEOUT
      value: '45.0'
    - name: QUALITY_REFINE_ENABLED
      value: 'true'
    - name: QUALITY_REFINE_MODEL
      value: 'ag/gemini-3.8-flash-medium'
    - name: QUALITY_REFINE_MAX_IMAGE_SIZE
      value: '1600'
    - name: QUALITY_REFINE_TIMEOUT
      value: '25.0'
    - name: QUALITY_REFINE_TOTAL_BUDGET
      value: '42.0'
    - name: QUALITY_REFINE_MIN_CONFIDENCE
      value: '0.80'
    - name: QUALITY_REFINE_SCORE_THRESHOLD
      value: '0.76'
    - name: QUALITY_REFINE_MIN_GAIN
      value: '0.03'
    - name: MAX_IMAGE_SIZE
      value: '1280'
    - name: POLYGON_MASK_MAX_IMAGE_SIZE
      value: '1280'
    - name: POLYGON_MASK_MAX_TOKENS
      value: '2500'
    - name: FEEDBACK_DATA_DIR
      value: '/opt/nuclio/feedback'
    - name: FEEDBACK_DB_PATH
      value: '/opt/nuclio/feedback/feedback.sqlite3'

  volumes:
    - volume:
        name: feedback-data
        hostPath:
          path: 'D:/tool-cvat/.tool-cvat'
      volumeMount:
        name: feedback-data
        mountPath: '/opt/nuclio/feedback'

  triggers:
    myHttpTrigger:
      numWorkers: 2
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 33554432 # 32MB

  build:
    image: cvat.custom.ninerouter.polygon.mask
    baseImage: python:3.11-slim
    directives:
      preCopy:
        - kind: RUN
          value: pip install --no-cache-dir requests pillow pyyaml

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
