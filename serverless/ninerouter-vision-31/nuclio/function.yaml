metadata:
  name: ninerouter-vision-31
  namespace: cvat
  annotations:
    name: 9Router Vision 31-Label Multi-Shape Detector
    type: detector
    spec: |
      [
        { "id": 1, "name": "pedestrian", "type": "any" },
        { "id": 2, "name": "rider", "type": "any" },
        { "id": 3, "name": "car", "type": "any" },
        { "id": 4, "name": "truck", "type": "any" },
        { "id": 5, "name": "bus", "type": "any" },
        { "id": 6, "name": "train", "type": "any" },
        { "id": 7, "name": "motorcycle", "type": "any" },
        { "id": 8, "name": "bicycle", "type": "any" },
        { "id": 9, "name": "traffic light", "type": "any" },
        { "id": 10, "name": "traffic sign", "type": "any" },
        { "id": 11, "name": "area/alternative", "type": "any" },
        { "id": 12, "name": "area/drivable", "type": "any" },
        { "id": 13, "name": "lane/crosswalk", "type": "any" },
        { "id": 14, "name": "lane/double white", "type": "any" },
        { "id": 15, "name": "lane/double yellow", "type": "any" },
        { "id": 16, "name": "lane/road curb", "type": "any" },
        { "id": 17, "name": "lane/single other", "type": "any" },
        { "id": 18, "name": "lane/single white", "type": "any" },
        { "id": 19, "name": "lane/single yellow", "type": "any" },
        { "id": 20, "name": "road", "type": "any" },
        { "id": 21, "name": "sidewalk", "type": "any" },
        { "id": 22, "name": "building", "type": "any" },
        { "id": 23, "name": "wall", "type": "any" },
        { "id": 24, "name": "fence", "type": "any" },
        { "id": 25, "name": "pole", "type": "any" },
        { "id": 26, "name": "vegetation", "type": "any" },
        { "id": 27, "name": "terrain", "type": "any" },
        { "id": 28, "name": "sky", "type": "any" },
        { "id": 29, "name": "person", "type": "any" },
        { "id": 30, "name": "traffic_light", "type": "any" },
        { "id": 31, "name": "traffic_sign", "type": "any" }
      ]

spec:
  description: 9Router Vision 31-Label AI Detector (Full Multi-Shape Road Scene Annotation via local 9Router)
  runtime: 'python:3.11'
  handler: main:handler
  eventTimeout: 180s

  env:
    - name: NINEROUTER_URL
      value: 'http://host.docker.internal:20128'
    - name: VISION_MODEL
      value: ''
    - name: DETECTION_MODE
      value: 'full_31'
    - name: NINEROUTER_TIMEOUT
      value: '120.0'
    - name: MAX_IMAGE_SIZE
      value: '1600'
    - name: FEEDBACK_DATA_DIR
      value: '/opt/nuclio/feedback'
    - name: FEEDBACK_DB_PATH
      value: '/opt/nuclio/feedback/feedback.sqlite3'

  volumes:
    - volume:
        name: feedback-data
        hostPath:
          path: 'D:/tool-cvat/.tool-cvat'
      volumeMount:
        name: feedback-data
        mountPath: '/opt/nuclio/feedback'

  triggers:
    myHttpTrigger:
      numWorkers: 2
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 33554432 # 32MB

  build:
    image: cvat.custom.ninerouter.vision.full31
    baseImage: python:3.11-slim
    directives:
      preCopy:
        - kind: RUN
          value: pip install --no-cache-dir requests pillow pyyaml

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume

