metadata:
  name: ninerouter-mask
  namespace: cvat
  annotations:
    name: 9Router Mask
    type: detector
    spec: |
      [
        { "id": 1, "name": "pedestrian", "type": "mask" },
        { "id": 2, "name": "rider", "type": "mask" },
        { "id": 3, "name": "car", "type": "mask" },
        { "id": 4, "name": "truck", "type": "mask" },
        { "id": 5, "name": "bus", "type": "mask" },
        { "id": 6, "name": "train", "type": "mask" },
        { "id": 7, "name": "motorcycle", "type": "mask" },
        { "id": 8, "name": "bicycle", "type": "mask" },
        { "id": 9, "name": "traffic light", "type": "mask" },
        { "id": 10, "name": "traffic sign", "type": "mask" },
        { "id": 11, "name": "pole", "type": "mask" },
        { "id": 12, "name": "person", "type": "mask" },
        { "id": 13, "name": "traffic_light", "type": "mask" },
        { "id": 14, "name": "traffic_sign", "type": "mask" }
      ]

spec:
  description: 9Router Mask Detector (14 foreground instances, mask only)
  runtime: 'python:3.11'
  handler: main:handler
  eventTimeout: 60s

  env:
    - name: NINEROUTER_URL
      value: 'https://9router-production-e47a.up.railway.app'
    - name: VISION_MODEL
      value: 'ag/gemini-3.8-flash-low'
    - name: MASK_MODEL
      value: 'ag/gemini-3.8-flash-low'
    - name: DETECTION_MODE
      value: 'mask'
    - name: NINEROUTER_TIMEOUT
      value: '45.0'
    - name: MAX_IMAGE_SIZE
      value: '1280'
    - name: MAX_TOKENS
      value: '2000'
    - name: FEEDBACK_DATA_DIR
      value: '/opt/nuclio/feedback'
    - name: FEEDBACK_DB_PATH
      value: '/opt/nuclio/feedback/feedback.sqlite3'

  volumes:
    - volume:
        name: feedback-data
        hostPath:
          path: 'D:/tool-cvat/.tool-cvat'
      volumeMount:
        name: feedback-data
        mountPath: '/opt/nuclio/feedback'

  triggers:
    myHttpTrigger:
      numWorkers: 2
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 33554432 # 32MB

  build:
    image: cvat.custom.ninerouter.mask
    baseImage: python:3.11-slim
    directives:
      preCopy:
        - kind: RUN
          value: pip install --no-cache-dir requests pillow pyyaml

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
