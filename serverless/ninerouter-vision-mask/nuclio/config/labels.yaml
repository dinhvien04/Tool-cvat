# CVAT and 9Router Vision Label Configuration
# IMPORTANT: Labels with similar or overlapping meanings (e.g. 'pedestrian' vs 'person',
# 'traffic light' vs 'traffic_light', 'traffic sign' vs 'traffic_sign') are intentional.
# DO NOT merge, normalize, alias, or rename them.

all_labels:
  - "pedestrian"
  - "rider"
  - "car"
  - "truck"
  - "bus"
  - "train"
  - "motorcycle"
  - "bicycle"
  - "traffic light"
  - "traffic sign"
  - "area/alternative"
  - "area/drivable"
  - "lane/crosswalk"
  - "lane/double white"
  - "lane/double yellow"
  - "lane/road curb"
  - "lane/single other"
  - "lane/single white"
  - "lane/single yellow"
  - "road"
  - "sidewalk"
  - "building"
  - "wall"
  - "fence"
  - "pole"
  - "vegetation"
  - "terrain"
  - "sky"
  - "person"
  - "traffic_light"
  - "traffic_sign"

