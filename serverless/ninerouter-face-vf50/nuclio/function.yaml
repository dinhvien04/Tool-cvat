spec:
  description: 9Router Face Landmark VF-50 Detector (VinAI 50 Facial Landmarks across 7 Component Skeletons via local 9Router)
  runtime: python:3.11
  handler: main:handler
  eventTimeout: 60s
  env:
  - name: NINEROUTER_URL
    value: http://host.docker.internal:20128
  - name: VISION_MODEL
    value: ag/gemini-3.8-flash-low
  - name: VF50_MODEL
    value: ag/gemini-3.8-flash-low
  - name: DETECTION_MODE
    value: face_vf50
  - name: NINEROUTER_TIMEOUT
    value: '45.0'
  - name: MAX_IMAGE_SIZE
    value: '1280'
  - name: MAX_TOKENS
    value: '2500'
  - name: FEEDBACK_DATA_DIR
    value: /opt/nuclio/feedback
  - name: FEEDBACK_DB_PATH
    value: /opt/nuclio/feedback/feedback.sqlite3
  volumes:
  - volume:
      name: feedback-data
      hostPath:
        path: D:/tool-cvat/.tool-cvat
    volumeMount:
      name: feedback-data
      mountPath: /opt/nuclio/feedback
  triggers:
    myHttpTrigger:
      numWorkers: 2
      kind: http
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        port: 5886
        maxRequestBodySize: 33554432
  build:
    image: cvat.custom.ninerouter.face.vf50
    baseImage: python:3.11-slim
    directives:
      preCopy:
      - kind: RUN
        value: pip install --no-cache-dir requests pillow pyyaml
  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
