metadata:
  name: ninerouter-polygon
  namespace: cvat
  annotations:
    name: 9Router Polygon
    type: detector
    spec: |
      [
        { "id": 1, "name": "area/alternative", "type": "polygon" },
        { "id": 2, "name": "area/drivable", "type": "polygon" },
        { "id": 3, "name": "road", "type": "polygon" },
        { "id": 4, "name": "sidewalk", "type": "polygon" },
        { "id": 5, "name": "building", "type": "polygon" },
        { "id": 6, "name": "wall", "type": "polygon" },
        { "id": 7, "name": "fence", "type": "polygon" },
        { "id": 8, "name": "vegetation", "type": "polygon" },
        { "id": 9, "name": "terrain", "type": "polygon" },
        { "id": 10, "name": "sky", "type": "polygon" }
      ]

spec:
  description: 9Router Polygon Detector (10 semantic regions, polygon only)
  runtime: 'python:3.11'
  handler: main:handler
  eventTimeout: 60s

  env:
    - name: NINEROUTER_URL
      value: 'https://9router-production-e47a.up.railway.app'
    - name: VISION_MODEL
      value: 'ag/gemini-3.8-flash-low'
    - name: POLYGON_MODEL
      value: 'ag/gemini-3.8-flash-low'
    - name: DETECTION_MODE
      value: 'polygon'
    - name: NINEROUTER_TIMEOUT
      value: '45.0'
    - name: MAX_IMAGE_SIZE
      value: '1280'
    - name: MAX_TOKENS
      value: '2500'
    - name: FEEDBACK_DATA_DIR
      value: '/opt/nuclio/feedback'
    - name: FEEDBACK_DB_PATH
      value: '/opt/nuclio/feedback/feedback.sqlite3'

  volumes:
    - volume:
        name: feedback-data
        hostPath:
          path: 'D:/tool-cvat/.tool-cvat'
      volumeMount:
        name: feedback-data
        mountPath: '/opt/nuclio/feedback'

  triggers:
    myHttpTrigger:
      numWorkers: 2
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 33554432 # 32MB

  build:
    image: cvat.custom.ninerouter.polygon
    baseImage: python:3.11-slim
    directives:
      preCopy:
        - kind: RUN
          value: pip install --no-cache-dir requests pillow pyyaml

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
