metadata:
  name: ninerouter-box-3d
  namespace: cvat
  annotations:
    name: 9Router Box 3D
    type: detector
    spec: |
      [
        { "id": 1, "name": "car", "type": "cuboid" },
        { "id": 2, "name": "truck", "type": "cuboid" },
        { "id": 3, "name": "bus", "type": "cuboid" },
        { "id": 4, "name": "trailer", "type": "cuboid" },
        { "id": 5, "name": "construction_vehicle", "type": "cuboid" },
        { "id": 6, "name": "pedestrian", "type": "cuboid" },
        { "id": 7, "name": "motorcycle", "type": "cuboid" },
        { "id": 8, "name": "bicycle", "type": "cuboid" }
      ]

spec:
  description: 9Router Box 3D Detector (8 nuScenes-style cuboid labels)
  runtime: 'python:3.11'
  handler: main:handler
  eventTimeout: 60s

  env:
    - name: NINEROUTER_URL
      value: 'https://9router-production-e47a.up.railway.app'
    - name: VISION_MODEL
      value: 'ag/gemini-3.8-flash-low'
    - name: BOX3D_MODEL
      value: 'ag/gemini-3.8-flash-low'
    - name: DETECTION_MODE
      value: 'box_3d'
    - name: NINEROUTER_TIMEOUT
      value: '45.0'
    - name: MAX_IMAGE_SIZE
      value: '1280'
    - name: MAX_TOKENS
      value: '1600'
    - name: FEEDBACK_DATA_DIR
      value: '/opt/nuclio/feedback'
    - name: FEEDBACK_DB_PATH
      value: '/opt/nuclio/feedback/feedback.sqlite3'

  volumes:
    - volume:
        name: feedback-data
        hostPath:
          path: 'D:/tool-cvat/.tool-cvat'
      volumeMount:
        name: feedback-data
        mountPath: '/opt/nuclio/feedback'

  triggers:
    myHttpTrigger:
      numWorkers: 2
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 33554432 # 32MB

  build:
    image: cvat.custom.ninerouter.box.3d
    baseImage: python:3.11-slim
    directives:
      preCopy:
        - kind: RUN
          value: pip install --no-cache-dir requests pillow pyyaml

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
